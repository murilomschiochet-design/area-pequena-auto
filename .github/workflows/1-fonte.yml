# 1) Todo dia às 06:17 e de novo às 06:47 (Roma, inverno; +1h no verão): junta as notícias da MARCA/AS/Mundo Deportivo
#    (fontes/noticias-AAAA-MM-DD.txt) e, se houver vídeo novo do @Cracks, a transcrição dele.
#    Minutos "quebrados" de propósito: o GitHub atrasa ou pula agendamentos na hora cheia. Rodar 2x não duplica (processados.json).
#    Depois a rotina do Claude (08:00) lê fontes/PENDENTE.txt e escreve os roteiros.
name: 1 - Fontes do dia

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/1-fonte.yml"]

permissions:
  contents: write

concurrency:
  group: fonte
  cancel-in-progress: false

jobs:
  fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -U yt-dlp certifi
      - name: Baixar transcricao
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python transcricao.py ultimo 2>&1 | tee fontes/_log.txt || true
      - name: Noticias MARCA / AS / Mundo Deportivo
        run: python noticias.py 2>&1 | tee -a fontes/_log.txt
      - name: Salvar no repositorio
        run: |
          git config user.name "area-pequena-bot"
          git config user.email "area-pequena-bot@users.noreply.github.com"
          git add fontes
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -m "fontes do dia: noticias $( [ -f fontes/PENDENTE.txt ] && echo "+ Cracks $(cat fontes/PENDENTE.txt)" )"
          git pull --rebase -q
          git push
