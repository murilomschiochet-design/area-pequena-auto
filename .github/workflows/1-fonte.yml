# 1) Todo dia às 05:00 (Roma, horário de inverno): pega o último vídeo do @Cracks e salva a transcrição em fontes/.
#    Depois a rotina do Claude (06:00) lê fontes/PENDENTE.txt e escreve os roteiros.
name: 1 - Transcricao do Cracks

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/1-fonte.yml"]

permissions:
  contents: write

concurrency:
  group: fonte
  cancel-in-progress: false

jobs:
  fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -U yt-dlp certifi
      - name: Baixar transcricao
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python transcricao.py ultimo 2>&1 | tee fontes/_log.txt
      - name: Salvar no repositorio
        run: |
          git config user.name "area-pequena-bot"
          git config user.email "area-pequena-bot@users.noreply.github.com"
          git add fontes
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -m "fonte: $(cat fontes/PENDENTE.txt)"
          git pull --rebase -q
          git push
