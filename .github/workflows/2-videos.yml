# 2) Quando um roteiro novo chega (roteiros/dia-XX.json), monta os 8 shorts + o vídeo longo e sobe AGENDADO no YouTube.
#    Também dá pra rodar à mão em Actions > "2 - Gerar e subir" > Run workflow (escolhendo o dia e se sobe ou não).
name: 2 - Gerar e subir

on:
  push:
    branches: [main]
    paths: ["roteiros/dia-*.json", "longo/roteiros/longo-dia-*.json", ".github/workflows/2-videos.yml"]
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia (ex.: dia-03). Vazio = o último roteiro"
        required: false
      subir:
        description: "Subir no YouTube?"
        type: choice
        options: ["sim", "nao"]
        default: "sim"

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONIOENCODING: utf-8
      USAR_PLAYWRIGHT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          mkdir -p ~/.fonts && cp modelo/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
      - name: Cache do modelo de recorte (rembg)
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-human-seg-v1
      - name: Instalar bibliotecas
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Qual dia
        id: dia
        run: |
          DIA="${{ github.event.inputs.dia }}"
          [ -z "$DIA" ] && DIA=$(ls roteiros/dia-*.json | sort | tail -1 | xargs basename | sed 's/.json//')
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"
          echo "Dia: $DIA"
      - name: Gerar shorts
        run: |
          set -o pipefail
          mkdir -p saida/${{ steps.dia.outputs.dia }}
          python gerar.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-shorts.txt
          python nuvem/folha_contato.py ${{ steps.dia.outputs.dia }}
      - name: Subir os shorts (agendados) antes do longo
        if: ${{ github.event.inputs.subir != 'nao' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "Sem chave do YouTube ainda: pulei o upload."; exit 0; fi
          python subir.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-subir.txt
      - name: TikTok (shorts como rascunho)
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CHAVE: ${{ secrets.TIKTOK_CHAVE }}
        run: |
          if [ -z "$TIKTOK_CHAVE" ]; then echo "Sem chave do TikTok: pulei."; exit 0; fi
          python tiktok.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-tiktok.txt
      - name: Pagina de legendas do TikTok (ap-legendas.pages.dev)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52b6bb474d2f430ceddd01ef2a1ccf32
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Sem token do Cloudflare: pulei a pagina."; exit 0; fi
          python legendas_pagina.py ${{ steps.dia.outputs.dia }}
          npx -y wrangler@4 pages deploy site-legendas --project-name ap-legendas --branch main --commit-dirty=true
      - name: Gerar video longo
        run: |
          set -o pipefail
          exec > >(tee saida/${{ steps.dia.outputs.dia }}/_log-longo.txt) 2>&1
          if [ -f "longo/roteiros/longo-${{ steps.dia.outputs.dia }}.json" ]; then
            python longo/gerar_longo.py longo-${{ steps.dia.outputs.dia }}
            python nuvem/folha_contato.py ${{ steps.dia.outputs.dia }} --longo
          else
            echo "sem roteiro do longo para este dia"
          fi
      - name: Thumbnail do longo
        continue-on-error: true
        run: |
          if [ -f "longo/roteiros/longo-${{ steps.dia.outputs.dia }}.json" ]; then
            python thumb_longo.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-thumb.txt
          fi
      - name: Subir no YouTube (agendado)
        if: ${{ github.event.inputs.subir != 'nao' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "Sem chave do YouTube ainda: pulei o upload."; exit 0; fi
          python subir.py ${{ steps.dia.outputs.dia }} 2>&1 | tee -a saida/${{ steps.dia.outputs.dia }}/_log-subir.txt
      - name: Guardar os videos pra conferir (3 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dia.outputs.dia }}
          path: |
            saida/${{ steps.dia.outputs.dia }}/*.mp4
            saida/${{ steps.dia.outputs.dia }}/*.jpg
            saida/${{ steps.dia.outputs.dia }}/painel.html
          retention-days: 3
      - name: Salvar banco de fotos e registros
        if: always()
        run: |
          git config user.name "area-pequena-bot"
          git config user.email "area-pequena-bot@users.noreply.github.com"
          git add banco fotos modelo/pessoas.json modelo/rostos saida tiktok_token.enc 2>/dev/null || true
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -q -m "videos ${{ steps.dia.outputs.dia }}: banco de fotos e registros"
          git pull --rebase -q
          git push
