<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>…</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0a0f0c}
#fundo{position:absolute;inset:-40px;background:url(../assets/estadio-fundo.jpg) center/cover;filter:blur(10px) saturate(1.25) brightness(.85)}
#cor{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 40%,rgba(0,0,0,.5)),
  linear-gradient(180deg,rgba(0,0,0,.15),transparent 30%,transparent 70%,rgba(0,0,0,.35))}
/* pessoas recortadas: contorno branco + sombra, cores mais vivas */
.pessoa{position:absolute;bottom:0;filter:saturate(1.18) contrast(1.06) drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 2px #fff) drop-shadow(12px 10px 20px rgba(0,0,0,.65))}
#p1{left:50%;transform:translateX(-50%);height:var(--p1h,700px);z-index:4}
#p2{left:var(--p2x,-20px);height:var(--p2h,600px);z-index:3}
#p3{right:var(--p3x,-10px);height:var(--p3h,560px);z-index:3}
.circ{position:absolute;border-radius:50%;overflow:hidden;border:7px solid #fff;z-index:5;background:#ddd center/cover;
  box-shadow:0 0 0 4px rgba(0,0,0,.35),8px 10px 22px rgba(0,0,0,.6)}
#c1{top:22px;left:calc(50% + 150px);width:215px;height:215px}
#c2{bottom:250px;right:24px;width:200px;height:200px}
#c3{top:22px;left:calc(50% - 365px);width:195px;height:195px}
.esc{position:absolute;z-index:6;background:center/contain no-repeat;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(8px 10px 14px rgba(0,0,0,.6))}
#e1{top:16px;right:16px;width:200px;height:200px}
#e2{top:16px;left:16px;width:165px;height:165px}
.esc.x::after{content:"";position:absolute;inset:6%;background:
  linear-gradient(45deg,transparent 43%,#ff1a2d 43%,#ff1a2d 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,#ff1a2d 43%,#ff1a2d 57%,transparent 57%);
  filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 2px #000)}
.esc.v::after{content:"✔";position:absolute;right:-18px;bottom:-34px;font:900 130px/1 Inter;color:#22d94a;-webkit-text-stroke:7px #0b3d14;paint-order:stroke fill}
#selo{position:absolute;left:20px;bottom:20px;z-index:7;display:flex;align-items:center;gap:10px;transform:rotate(-4deg)}
#selo img{width:86px;height:86px;border-radius:50%;border:5px solid #d7ff3a;box-shadow:4px 5px 0 #000}
#selo span{font-family:Anton,sans-serif;font-size:54px;line-height:.9;color:#fff;text-transform:uppercase;-webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:5px 6px 0 #000}
#selo span b{color:#d7ff3a;font-weight:400;display:block}
</style></head>
<body>
<div id="fundo"></div><div id="cor"></div>
<img class="pessoa" id="p3"><img class="pessoa" id="p2"><img class="pessoa" id="p1">
<div class="circ" id="c3"></div><div class="circ" id="c1"></div><div class="circ" id="c2"></div>
<div class="esc" id="e2"></div><div class="esc" id="e1"></div>
<div id="selo"><img src="../canal/perfil.png"><span>Área<b>Pequeña</b></span></div>
<script>
// hash: {fundo, p1,p2,p3 (recortes png), c1,c2,c3 (fotos) + c1pos..., e1,e2 (escudos png) + e1marca ("x"|"v"), layout:{...}}
const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
const css = document.documentElement.style;
if (d.fundo) document.getElementById('fundo').style.backgroundImage = `url("${d.fundo}")`;
for (const k of ['p1','p2','p3']) { const el = document.getElementById(k); if (d[k]) el.src = d[k]; else el.remove(); }
for (const k of ['c1','c2','c3']) { const el = document.getElementById(k); if (d[k]) { el.style.backgroundImage = `url("${d[k]}")`;
  if (d[k+'pos']) el.style.backgroundPosition = d[k+'pos']; } else el.remove(); }
for (const k of ['e1','e2']) { const el = document.getElementById(k); if (d[k]) { el.style.backgroundImage = `url("${d[k]}")`;
  if (d[k+'marca']) el.classList.add(d[k+'marca']); } else el.remove(); }
// sem escudo à esquerda, o círculo 3 sobe pro canto
if (!d.e2) { const c3 = document.getElementById('c3'); if (c3) { c3.style.left = '24px'; } }
for (const [k,v] of Object.entries(d.layout || {})) css.setProperty('--' + k, v);
async function pronto(){ await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  // ninguém fica largo demais: limita a largura de cada recorte
  for (const [k, max] of [['p1', 560], ['p2', 470], ['p3', 520]]) { const el = document.getElementById(k);
    if (el && el.offsetWidth > max) { el.style.height = 'auto'; el.style.width = max + 'px'; } }
  document.title = 'ok'; }
pronto();
</script>
</body></html>
