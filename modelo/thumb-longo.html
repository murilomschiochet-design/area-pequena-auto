<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>…</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0a0f0c}
#fundo{position:absolute;inset:-40px;background:url(../assets/estadio-fundo.jpg) center/cover;filter:blur(var(--blur,9px)) saturate(1.15) brightness(.9)}
#cor{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.45))}
.pessoa{position:absolute;bottom:0;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(10px 8px 18px rgba(0,0,0,.6))}
#p1{left:var(--p1x,330px);height:var(--p1h,700px);z-index:3}
#p2{left:var(--p2x,20px);height:var(--p2h,600px);z-index:2}
#p3{right:var(--p3x,10px);height:var(--p3h,560px);z-index:2}
.circ{position:absolute;width:250px;height:250px;border-radius:50%;overflow:hidden;border:8px solid #fff;z-index:4;
  box-shadow:0 0 0 5px rgba(0,0,0,.35),8px 10px 22px rgba(0,0,0,.55);background:#ddd center/cover}
#c1{top:24px;right:250px}
#c2{bottom:28px;right:40px;width:230px;height:230px}
#escudo{position:absolute;top:22px;right:24px;width:190px;height:190px;border-radius:50%;background:#fff center/78% no-repeat;z-index:5;
  border:7px solid #fff;box-shadow:8px 10px 20px rgba(0,0,0,.5)}
#escudo.x::after{content:"";position:absolute;inset:-10px;background:
  linear-gradient(45deg,transparent 45%,#e3142a 45%,#e3142a 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#e3142a 45%,#e3142a 55%,transparent 55%)}
#escudo.v::after{content:"✔";position:absolute;right:-14px;bottom:-26px;font:900 120px Inter;color:#2bd34a;-webkit-text-stroke:6px #0b3d14}
#selo{position:absolute;left:22px;bottom:22px;z-index:6;display:flex;align-items:center;gap:10px;transform:rotate(-4deg)}
#selo img{width:92px;height:92px;border-radius:50%;border:5px solid #d7ff3a;box-shadow:4px 5px 0 #000}
#selo span{font-family:Anton,sans-serif;font-size:58px;line-height:.9;color:#fff;text-transform:uppercase;-webkit-text-stroke:9px #000;paint-order:stroke fill;
  text-shadow:5px 6px 0 #000}
#selo span b{color:#d7ff3a;font-weight:400;display:block}
#placar{position:absolute;z-index:6;top:250px;left:24px;display:grid;grid-template-columns:auto auto;gap:4px;background:#0b0b0b;border:5px solid #fff;border-radius:12px;padding:8px 12px;box-shadow:6px 7px 0 rgba(0,0,0,.6)}
#placar div{font:400 54px/1 Anton;color:#fff;text-align:center}
#placar img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
#seta{position:absolute;z-index:6;width:220px;height:150px;overflow:visible}
</style></head>
<body>
<div id="fundo"></div><div id="cor"></div>
<img class="pessoa" id="p2"><img class="pessoa" id="p3"><img class="pessoa" id="p1">
<div class="circ" id="c1"></div><div class="circ" id="c2"></div>
<div id="escudo"></div>
<div id="selo"><img src="../canal/perfil.png"><span>Área<b>Pequeña</b></span></div>
<svg id="seta" viewBox="0 0 220 150"><path d="M200 20 C 170 120, 80 140, 30 100" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round"/>
<path d="M200 20 C 170 120, 80 140, 30 100" fill="none" stroke="#ff1f1f" stroke-width="22" stroke-linecap="round"/>
<polygon points="0,80 70,55 60,130" fill="#ff1f1f" stroke="#000" stroke-width="7" stroke-linejoin="round"/></svg>
<script>
// hash: {fundo (foto com torcida, vai desfocada), p1,p2,p3 (recortes png), c1,c2 (fotos), escudo, marca:"x"|"v"|"", seta:{x,y,rot}|null, placar:{a,b,ga,gb}}
const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
const css = document.documentElement.style;
if (d.fundo) document.getElementById('fundo').style.backgroundImage = `url("${d.fundo}")`;
for (const k of ['p1','p2','p3']) { const el = document.getElementById(k); if (d[k]) el.src = d[k]; else el.remove(); }
for (const k of ['c1','c2']) { const el = document.getElementById(k); if (d[k]) el.style.backgroundImage = `url("${d[k]}")`; else el.remove();
  if (d[k+'pos']) el.style.backgroundPosition = d[k+'pos']; }
const es = document.getElementById('escudo');
if (d.escudo) { es.style.backgroundImage = `url("${d.escudo}")`; if (d.marca) es.classList.add(d.marca); } else es.remove();
const seta = document.getElementById('seta');
if (d.seta) seta.style.cssText += `left:${d.seta.x}px;top:${d.seta.y}px;transform:rotate(${d.seta.rot||0}deg)`; else seta.remove();
for (const [k,v] of Object.entries(d.layout || {})) css.setProperty('--' + k, v);
async function pronto(){ await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  document.title = 'ok'; }
pronto();
</script>
</body></html>
