<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif}
/* estilo A — vidro escuro */
.card{position:absolute;left:60px;width:960px;top:170px;background:rgba(10,14,20,.55);border:2px solid rgba(255,255,255,.14);border-radius:44px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo{width:100%;height:520px;object-fit:cover;object-position:50% 18%;display:block;border-radius:28px;background:#1a2028}
.tag{display:inline-flex;align-items:center;gap:14px;font:800 30px Inter;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:34px 10px 18px}
.dot{width:16px;height:16px;border-radius:50%;background:#ff2d3d;box-shadow:0 0 0 6px rgba(255,45,61,.25)}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.02;color:#fff;font-size:84px;margin:0 10px 24px}
h1 em{font-style:normal;color:#d7ff3a}
p{font-weight:500;line-height:1.42;color:rgba(255,255,255,.9);font-size:37px;margin:0 10px}
p b{font-weight:800;color:#d7ff3a}
.cta{font:800 30px Inter;letter-spacing:.06em;text-transform:uppercase;margin:30px 10px 6px;color:#fff;display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.14);padding-top:26px}
.cta span{background:#ff2d3d;padding:12px 22px;border-radius:999px}
.credito{position:absolute;right:20px;top:488px;font:600 18px Inter;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:4px 10px;border-radius:8px;max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
<div class="card" id="card"></div>
<script>
// dados chegam no hash: #<json url-encoded> {foto, tag, titulo, texto, credito}
const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const titulo = esc(d.titulo).replace(/\*([^*]+)\*/g, '<em>$1</em>');     // *palabra* = destaque verde
const texto = esc(d.texto).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');     // **nombre** = destaque
const c = document.getElementById('card');
c.innerHTML = `<div style="position:relative">${d.foto ? `<img class="photo" src="${d.foto}">` : '<div class="photo"></div>'}${d.credito ? `<div class="credito">📷 ${esc(d.credito)}</div>` : ''}</div>
<div class="tag"><span class="dot"></span>${esc(d.tag || 'Última hora')}</div>
<h1>${titulo}</h1><p>${texto}</p>
<div class="cta">@área_pequeña <span>Suscríbete 🔔</span></div>`;
// o card não pode passar de 1560px (embaixo fica a interface do Shorts): diminui fonte/foto se precisar
const LIMITE = 1560;
const h1 = c.querySelector('h1'), p = c.querySelector('p'), ph = c.querySelector('.photo');
function cabe(){ return c.getBoundingClientRect().bottom <= LIMITE; }
async function ajustar(){
  await document.fonts.ready;
  const img = c.querySelector('img'); if (img && !img.complete) await new Promise(r => { img.onload = img.onerror = r; });
  let t = 84, s = 37, f = 520;
  while (!cabe() && t > 62) { t -= 2; h1.style.fontSize = t + 'px'; }
  while (!cabe() && f > 380) { f -= 20; ph.style.height = f + 'px'; }
  while (!cabe() && s > 28) { s -= 1; p.style.fontSize = s + 'px'; }
  document.title = cabe() ? 'ok' : 'grande';
}
ajustar();
</script>
</body></html>
